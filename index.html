<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min AR Modell</title>
    <!-- Den offisielle og korrekte lenken til Googles AR-motor -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body { margin: 0; padding: 0; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; background-color: #000000; }
        model-viewer { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <model-viewer 
        src="cube.glb" 
        ios-src="cube.usdz" 
        ar
        ar-modes="webxr scene-viewer quick-look" 
        camera-controls 
        touch-action="pan-y" 
        alt="En 3D-modell i AR" 
        shadow-intensity="1">
    </model-viewer>
</body>
</html>
